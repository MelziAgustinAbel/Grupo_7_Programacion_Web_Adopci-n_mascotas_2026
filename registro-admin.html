<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Crear primer Administrador | Huellitas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>🐾 Huellitas</h1>
    </header>
    <main class="portada">
        <section class="caja" id="primer-admin">
            <h2>Configuracion inicial</h2>
            <p>No encontramos ningun usuario con perfil <span class="destacado">administrador</span>
               Para continuar, crea el primero.</p>
            <form action="admin.html" method="POST">
                <p class="campo">
                    <label for="nombre">Nombre y apellido:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p class="campo">
                    <label for="clave">Contraseña:</label>
                    <input type="password" id="clave" name="clave" required>
                </p>
                <p class="campo">
                    <label for="clave2">Repetir contraseña:</label>
                    <input type="password" id="clave2" name="clave2" required>
                </p>
                <div class="botones-form">
                    <button type="submit">Crear Administrador</button>
                    <button type="reset" class="secundario">Limpiar</button>
                </div>
            </form>
            <p><small>Perfil asignado: Administrador</small></p>
        </section>
    </main>
    <footer>
         <p><small>&copy; 2026 Huellitas - Adopcion responsable de mascotas. TP de Programacion Web I.</small></p>
    </footer>

    
    <button type="button" class="boton-tema">Tema oscuro</button>
</body>
</html>
